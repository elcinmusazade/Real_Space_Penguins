<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09121e">
  <meta name="description" content="Design spacecraft and missions, establish surface and orbital hubs, and explore Mars, Venus, Mercury, and Europa in a Python-powered space strategy game.">
  <title>Ares: First Light — Interplanetary Command</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230c1726'/%3E%3Ccircle cx='21' cy='20' r='10' fill='%23b76c51'/%3E%3Cpath d='M5 26 Q20 8 35 13' fill='none' stroke='%237fc3cd' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./campaign.css">
  <link rel="stylesheet" href="./map-game.css">
  <link rel="stylesheet" href="./program.css">
  <link rel="stylesheet" href="./tutorial.css">
  <link rel="stylesheet" href="./advisor.css">
  <link rel="stylesheet" href="./shipyard.css">
  <link rel="stylesheet" href="./solar-system.css">
  <link rel="stylesheet" href="./tech-tree.css">
  <link rel="stylesheet" href="./jarvis.css">
</head>
<body>
  <div id="app"><div class="loading"><span class="loading-mark">◈</span><h1>Ares: Interplanetary Command</h1><p>Connecting to the Python mission engine…</p></div></div>
  <div id="notification-root" aria-live="polite"></div>
  <aside id="jarvis" aria-label="JARVIS campaign assistant" hidden>
    <button type="button" class="jarvis-launch" aria-label="Open JARVIS chat" aria-controls="jarvis-panel" aria-expanded="false"><span class="jarvis-orb" aria-hidden="true"></span><span>JARVIS<small class="jarvis-invite" aria-hidden="true">Open chat</small></span></button>
    <section class="jarvis-panel" id="jarvis-panel" role="dialog" aria-labelledby="jarvis-title" hidden>
      <header class="jarvis-head"><span class="jarvis-orb" aria-hidden="true"></span><div><h2 id="jarvis-title">JARVIS</h2><small>Campaign assistant · Gemini</small></div><span class="jarvis-turn"></span><button type="button" class="jarvis-close" aria-label="Close JARVIS chat">×</button></header>
      <div class="jarvis-intro"><p>What do you need, Commander?</p><small>Gemini receives your question, recent chat and a summary of your campaign.</small><button type="button">What should I do next?</button><button type="button">How are my supplies?</button></div>
      <div class="jarvis-log" role="log" aria-label="Conversation" aria-live="polite"></div>
      <p class="jarvis-status" role="status"></p><button type="button" class="jarvis-retry" hidden>Retry</button>
      <form class="jarvis-form"><textarea rows="1" maxlength="600" aria-label="Question for JARVIS" placeholder="Ask about your campaign…"></textarea><button type="submit" aria-label="Send question" disabled>↑</button></form>
    </section>
  </aside>
  <script type="module" src="./campaign.js"></script>
</body>
</html>
